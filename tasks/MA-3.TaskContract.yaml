apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: MA-3
  title: "mcp-apps-starter becomes an Orun baseline"
spec:
  goal: blueprint.yaml and repo-blueprint.yaml take a new MCP Apps server from nothing to live on stage and prod in one landing, held by Baseline CI
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - .baseline
    - .github/workflows/baseline.yml
    - .github/workflows/tag.yml
    - ai/context
    - docs/phases
    - hooks
    - testing
    - tooling/rebrand
    - tooling/bootstrap
    - tooling/catalog
    - apps/web/docs
    - tests/web/docs
    - specs/epics/mcp-apps-starter
    - README.md
  doneWhen:
    - every Baseline CI tier is green
    - a server placed from it carries the server only, branded, its Worker and self-binding named for it
  gates: []
